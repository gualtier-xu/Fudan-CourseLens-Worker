name: Process encrypted CourseLens LLM job
run-name: CourseLens llm ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Opaque 32-character job identifier
        required: true
        type: string
      protocol_version:
        description: Encrypted job protocol version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: courselens-compute-${{ github.repository_id }}-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: courselens-worker
    env:
      COURSELENS_TASK_ID: ${{ inputs.task_id }}
      COURSELENS_PROTOCOL_VERSION: ${{ inputs.protocol_version }}
      COURSELENS_WORKFLOW_PROFILE: llm-v1
      PRIVATE_JOB_REPO: ${{ vars.COURSELENS_MAILBOX_REPO }}
      PRIVATE_JOB_REPO_TOKEN: ${{ secrets.COURSELENS_JOB_TOKEN || secrets.PRIVATE_JOB_REPO_TOKEN }}
      WORKER_INPUT_PRIVATE_KEY: ${{ secrets.WORKER_INPUT_PRIVATE_KEY }}
      WORKER_SIGNING_PRIVATE_KEY: ${{ secrets.WORKER_SIGNING_PRIVATE_KEY }}
      COURSELENS_RESULT_PATH: ${{ github.workspace }}/result.box.json
      # N1：纯 LLM 任务（summary/chapters/quality_judge/answer-only/带 PPT 的
      # OCR 总结）免付媒体环境（apt/ffmpeg/ASR 模型缓存三步全无）。带 PPT 的
      # 总结 OCR 只需 rapidocr（在下方精简装机组内）。刻意不注入模型根目录
      # 环境变量：媒体 kind 误入本工作流时按既有闭集语义 fail-closed，不带病
      # 运行。思考档与 OCR 并发沿用执行仓 Variables。
      # N9：执行仓 Variables 缺席时的回退默认与客户端 bootstrap 钉值一致（2，
      # 代码侧帽 min(2, env) 不变）。
      COURSELENS_OCR_CONCURRENCY: ${{ vars.COURSELENS_OCR_CONCURRENCY || '2' }}
      COURSELENS_JUDGE_THINKING: ${{ vars.COURSELENS_JUDGE_THINKING || 'low' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimal LLM runtime
        run: python -m pip install PyNaCl==1.6.2 requests==2.34.2 zstandard==0.25.0 numpy==2.2.6 Pillow==12.3.0 rapidocr-onnxruntime==1.4.4 pycryptodome==3.23.0 curl-cffi==0.15.0
      - name: Process encrypted job
        run: python -m courselens_worker
      - name: Upload encrypted checkpoints
        if: always() && hashFiles('.work/checkpoints/*.box.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: courselens-checkpoint-${{ inputs.task_id }}-${{ github.run_attempt }}
          path: .work/checkpoints/*.box.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Upload encrypted result only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: courselens-result-${{ inputs.task_id }}
          path: result.box.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove transient data
        if: always()
        run: |
          rm -f result.box.json
          rm -rf .work
